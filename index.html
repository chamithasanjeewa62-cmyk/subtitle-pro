<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subtitle Pro - Fast</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{--bg:#080b14;--card:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.1);--text:#f5f7ff;--muted:#939bb3}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at 15% 10%,#1a1840 0%,transparent 40%),radial-gradient(ellipse at 85% 80%,#0e2342 0%,transparent 45%),var(--bg);color:var(--text);font-family:'Inter',sans-serif}
nav{max-width:1150px;margin:0 auto;padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;backdrop-filter:blur(20px);z-index:10;background:rgba(8,11,20,0.8)}
.logo{font-weight:800;display:flex;gap:10px;align-items:center}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#7c5cff,#3b82f6);border-radius:10px;display:grid;place-items:center}
main{max-width:1150px;margin:0 auto;padding:30px 20px}
.hero{display:grid;grid-template-columns:1.2fr 0.8fr;gap:24px;align-items:center;margin-bottom:30px}
.hero h1{font-size:clamp(32px,5vw,52px);line-height:1;letter-spacing:-2px;font-weight:800}
.hero h1 span{background:linear-gradient(90deg,#a78bfa,#60a5fa,#67e8f9);-webkit-background-clip:text;color:transparent}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.07),rgba(255,255,255,0.03));border:1px solid var(--border);border-radius:20px;padding:20px}
.upload{border:1.5px dashed rgba(255,255,255,0.18);border-radius:14px;padding:20px;text-align:center;cursor:pointer;background:rgba(0,0,0,0.25)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:white;font-family:inherit;font-size:13px}
label{font-size:10px;letter-spacing:1px;color:#aab1c7;font-weight:600;margin:14px 0 6px;display:block}
.btn{background:linear-gradient(100deg,#7c5cff,#4f6ef7);border:none;font-weight:600;cursor:pointer;transition:0.2s}
.btn:disabled{opacity:0.4}
.log{margin-top:12px;font-size:11px;color:#cbd5e1;background:rgba(0,0,0,0.3);padding:10px;border-radius:10px;display:none;white-space:pre-wrap}
#fileInput{display:none}
.bar{height:6px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;margin-top:12px;display:none}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#7c5cff,#60a5fa);transition:0.3s}
.controls{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin:30px 0 18px}
.search-row{display:flex;gap:10px}
.search-box{flex:1;display:flex;align-items:center;background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:12px;padding:0 14px}
.search-box input{flex:1;background:transparent;border:none;color:white;padding:12px 10px;font-family:inherit;font-size:13px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--muted)}
.chip.active{background:linear-gradient(100deg,#7c5cff,#4f6ef7);color:white;border-color:transparent}
.chip.imdb{background:#f5c518;color:#000;font-weight:700}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 14px}
.movies{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.movie{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer}
.poster{aspect-ratio:2/3;width:100%;object-fit:cover;display:block}
.movie-info{padding:10px 11px}
.movie-info h3{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:8px;align-items:center;margin-top:6px}
.rating{background:#f5c518;color:#000;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.year{font-size:10px;color:var(--muted)}
@media(max-width:900px){.hero{grid-template-columns:1fr}.movies{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<nav><div class="logo"><div class="logo-icon"><i class="fa-solid fa-closed-captioning"></i></div> SUBTITLE PRO</div><div style="font-size:10px;padding:6px 10px;border:1px solid #7c5cff44;border-radius:20px;color:#a78bfa">FAST MODE</div></nav>
<main>
<div class="hero">
<div><h1>Translate Subtitles <br><span>10x Faster.</span></h1><p style="color:#939bb3;margin-top:14px;font-size:13px;line-height:1.7">Now using Google Translate Engine + Parallel Batch Processing.</p></div>
<div class="card">
<div class="upload" id="drop"><i class="fa-solid fa-file-arrow-up" style="color:#a78bfa"></i><div id="fname" style="margin-top:8px;font-size:13px;font-weight:600">Upload .SRT File</div><input type="file" id="fileInput" accept=".srt,.txt"></div>
<div class="row"><div><label>FROM</label><select id="from"><option value="en">English</option><option value="si">Sinhala</option><option value="ta">Tamil</option><option value="hi">Hindi</option></select></div><div><label>TO</label><select id="to"><option value="si">Sinhala</option><option value="ta">Tamil</option><option value="en">English</option><option value="hi">Hindi</option></select></div></div>
<button class="btn" id="btn" disabled style="margin-top:16px;padding:13px">Translate & Download (FAST)</button>
<div class="bar" id="bar"><div class="fill" id="fill"></div></div>
<div class="log" id="log"></div>
</div>
</div>

<div class="controls">
<div class="search-row">
<div class="search-box"><i class="fa-solid fa-magnifying-glass" style="color:#939bb3;font-size:13px"></i><input id="searchInput" placeholder="Search any movie..."></div>
<button id="searchBtn" class="btn" style="width:auto;padding:12px 20px">Search</button>
</div>
<div class="chips" id="chips">
<div class="chip active" data-type="upcoming">Upcoming</div>
<div class="chip" data-type="popular">Popular Now</div>
<div class="chip imdb" data-type="top_rated">Top IMDb</div>
<div class="chip" data-genre="28">Action</div>
<div class="chip" data-genre="27">Horror</div>
<div class="chip" data-genre="35">Comedy</div>
<div class="chip" data-genre="878">Sci-Fi</div>
<div class="chip" data-genre="53">Thriller</div>
</div>
</div>

<div class="section-head"><h2 id="sectionTitle">Upcoming Movies</h2><span id="count">Loading...</span></div>
<div class="movies" id="movies"></div>
</main>

<script>
const API_KEY='3e931d5679569246e96918302b26fdfc';
const fileInput=document.getElementById('fileInput'), drop=document.getElementById('drop'), fname=document.getElementById('fname'), btn=document.getElementById('btn'), bar=document.getElementById('bar'), fill=document.getElementById('fill'), logEl=document.getElementById('log'), moviesEl=document.getElementById('movies'), searchInput=document.getElementById('searchInput'), searchBtn=document.getElementById('searchBtn'), sectionTitle=document.getElementById('sectionTitle'), countEl=document.getElementById('count');
let parsed=[];
function showLog(t){logEl.style.display='block';logEl.textContent=t;}
drop.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',()=>{if(fileInput.files[0]) loadFile(fileInput.files[0]);});
drop.addEventListener('dragover',e=>{e.preventDefault();});
drop.addEventListener('drop',e=>{e.preventDefault(); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);});
function loadFile(file){fname.textContent=file.name;showLog('Loaded: '+file.name);const reader=new FileReader();reader.onload=e=>{parsed=parseSRT(e.target.result);showLog(`Found ${parsed.length} subtitles. Ready to translate FAST.`);if(parsed.length>0) btn.disabled=false;};reader.readAsText(file);}
function parseSRT(data){data=data.replace(/\r/g,'').trim();const blocks=data.split(/\n\n+/);const out=[];for(let b of blocks){const lines=b.split('\n');if(lines.length>=2){let id=lines[0],time='',content='';if(lines[0].includes('-->')){time=lines[0];content=lines.slice(1).join('\n');id=out.length+1;}else if(lines[1]?.includes('-->')){time=lines[1];content=lines.slice(2).join('\n');}else continue;if(content) out.push({id,time,content});}}return out;}

// --- FAST GOOGLE TRANSLATE ---
async function translateOne(text,from,to){
  try{
    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`);
    const data = await res.json();
    return data[0][0][0] || text;
  }catch{ return text; }
}

btn.addEventListener('click', async()=>{
  const from=document.getElementById('from').value, to=document.getElementById('to').value;
  bar.style.display='block'; btn.disabled=true; btn.textContent='Translating...';
  let result = new Array(parsed.length);
  let done = 0;
  const BATCH = 8;
  for(let i=0; i<parsed.length; i+=BATCH){
    const batch = parsed.slice(i, i+BATCH);
    await Promise.all(batch.map(async (item, idx) => {
      const realIdx = i+idx;
      const tr = await translateOne(item.content, from, to);
      result[realIdx] = {...item, content: tr};
      done++;
      fill.style.width = Math.round((done/parsed.length)*100)+'%';
      showLog(`FAST Translating ${done}/${parsed.length} - ${Math.round((done/parsed.length)*100)}%`);
    }));
  }
  const finalContent=result.map(r=>`${r.id}\n${r.time}\n${r.content}`).join('\n\n');
  const blob=new Blob([finalContent],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${to}_FAST_translated.srt`; a.click();
  showLog(`Done! ${done} lines in fast mode.`); bar.style.display='none'; btn.disabled=false; btn.textContent='Translate & Download (FAST)';
});

async function fetchMovies(url, title){
 moviesEl.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#939bb3">Loading...</div>';
 sectionTitle.textContent=title;
 const res=await fetch(url); const data=await res.json();
 const list=(data.results||[]).slice(0,20).map(m=>({title:m.title,year:m.release_date?.slice(0,4)||'2026',rating:m.vote_average?.toFixed(1)||'7.5',poster:m.poster_path?`https://image.tmdb.org/t/p/w500${m.poster_path}`:'https://via.placeholder.com/500x750'}));
 countEl.textContent=`${list.length} Movies`;
 moviesEl.innerHTML=''; list.forEach(m=>{const div=document.createElement('div');div.className='movie';div.innerHTML=`<img class="poster" src="${m.poster}"><div class="movie-info"><h3>${m.title}</h3><div class="meta"><span class="rating">★ ${m.rating}</span><span class="year">${m.year}</span></div></div>`;moviesEl.appendChild(div);});
}
document.querySelectorAll('.chip').forEach(chip=>{
 chip.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); chip.classList.add('active');
  const type=chip.dataset.type, genre=chip.dataset.genre;
  if(type==='upcoming') fetchMovies(`https://api.themoviedb.org/3/movie/upcoming?api_key=${API_KEY}&language=en-US&page=1`,'Upcoming Movies');
  else if(type==='popular') fetchMovies(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=en-US&page=1`,'Popular Now');
  else if(type==='top_rated') fetchMovies(`https://api.themoviedb.org/3/movie/top_rated?api_key=${API_KEY}&language=en-US&page=1`,'Top IMDb Rated');
  else if(genre) fetchMovies(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${genre}&sort_by=popularity.desc`,'Genre: '+chip.textContent);
 });
});
function doSearch(){const q=searchInput.value.trim(); if(!q) return; fetchMovies(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(q)}`,'Search: '+q);}
searchBtn.addEventListener('click',doSearch);
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter') doSearch();});
fetchMovies(`https://api.themoviedb.org/3/movie/upcoming?api_key=${API_KEY}&language=en-US&page=1`,'Upcoming Movies');
</script>
</body>
</html>
