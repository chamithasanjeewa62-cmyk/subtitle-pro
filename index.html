<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subtitle Pro - Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{--bg:#080b14;--card:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.1)}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#f5f7ff;font-family:Inter,sans-serif}
body.modal-open{overflow:hidden}
nav{max-width:1150px;margin:0 auto;padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;backdrop-filter:blur(20px);z-index:10;background:rgba(8,11,20,0.8)}
main{max-width:1150px;margin:0 auto;padding:30px 20px;transition:filter .3s}
main.blurred{filter:blur(18px) brightness(0.4)}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;margin-bottom:30px}
.hero h1{font-size:clamp(32px,5vw,52px);line-height:1;font-weight:800}
.hero h1 span{background:linear-gradient(90deg,#a78bfa,#60a5fa);-webkit-background-clip:text;color:transparent}
.card{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:20px;padding:20px}
.upload{border:1.5px dashed rgba(255,255,255,0.18);border-radius:14px;padding:20px;text-align:center;cursor:pointer}
select,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:white}
.btn{background:linear-gradient(100deg,#7c5cff,#4f6ef7);border:none;font-weight:600;cursor:pointer}
#fileInput{display:none}.bar{height:6px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;margin-top:12px;display:none}.fill{height:100%;width:0%;background:linear-gradient(90deg,#7c5cff,#60a5fa);transition:.3s}
.log{margin-top:12px;font-size:11px;background:rgba(0,0,0,0.3);padding:10px;border-radius:10px;display:none}
.controls{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin:30px 0 18px}
.search-row{display:flex;gap:10px}.search-box{flex:1;display:flex;align-items:center;background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:12px;padding:0 14px}
.search-box input{flex:1;background:transparent;border:none;color:white;padding:12px 10px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:12px}.chip{white-space:nowrap;padding:7px 14px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:#939bb3}
.chip.active{background:linear-gradient(100deg,#7c5cff,#4f6ef7);color:white}
.movies{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.movie{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer}
.poster{aspect-ratio:2/3;width:100%;object-fit:cover}
.movie-info{padding:10px}.rating{background:#f5c518;color:#000;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
/* MODAL PREMIUM */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(24px);z-index:100;display:none;place-items:center;padding:20px}
.modal-overlay.active{display:grid}
.modal{width:100%;max-width:850px;background:#141a2e;border:1px solid rgba(255,255,255,0.12);border-radius:24px;overflow:hidden;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.9) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-banner{position:relative;height:480px;background:#000;overflow:hidden}
.modal-banner img{width:100%;height:100%;object-fit:cover;opacity:0.6}
.modal-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#141a2e 10%,rgba(20,26,46,0.4) 60%,rgba(0,0,0,0.3))}
.top-bar{position:absolute;top:0;left:0;right:0;z-index:3;padding:18px;display:flex;justify-content:center}
.back-btn{background:rgba(255,255,255,0.12);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.2);padding:10px 28px;border-radius:30px;color:white;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,0.4);transition:.2s}
.back-btn:hover{background:rgba(255,255,255,0.2);transform:scale(1.05)}
.trailer-wrap{position:absolute;inset:0;z-index:1;display:none}
.trailer-wrap.active{display:block}
.trailer-wrap iframe{width:100%;height:100%;border:none}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;width:80px;height:80px;background:rgba(255,255,255,0.9);border-radius:50%;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 10px rgba(255,255,255,0.15),0 10px 40px rgba(0,0,0,0.5);transition:.2s}
.play-btn:hover{transform:translate(-50%,-50%) scale(1.1)}
.play-btn i{font-size:28px;color:#000;margin-left:4px}
.modal-content{padding:28px;margin-top:-90px;position:relative;z-index:2}
@media(max-width:900px){.hero{grid-template-columns:1fr}.movies{grid-template-columns:repeat(2,1fr)}.modal-banner{height:380px}}
</style>
</head>
<body>
<nav><div style="font-weight:800"><i class="fa-solid fa-closed-captioning" style="color:#7c5cff"></i> SUBTITLE PRO</div></nav>
<main id="mainContent">
<div class="hero"><div><h1>Translate Subtitles <br><span>10x Faster.</span></h1></div>
<div class="card"><div class="upload" id="drop"><div id="fname">Upload .SRT File</div><input type="file" id="fileInput" accept=".srt,.txt"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><div><select id="from"><option value="en">English</option><option value="si">Sinhala</option><option value="ta">Tamil</option></select></div><div><select id="to"><option value="si">Sinhala</option><option value="ta">Tamil</option><option value="en">English</option></select></div></div>
<button class="btn" id="btn" disabled style="margin-top:16px;padding:13px">Translate FAST</button>
<div class="bar" id="bar"><div class="fill" id="fill"></div></div><div class="log" id="log"></div></div></div>
<div class="controls"><div class="search-row"><div class="search-box"><input id="searchInput" placeholder="Search movie..."><i class="fa-solid fa-magnifying-glass" style="color:#939bb3"></i></div><button id="searchBtn" class="btn" style="width:auto;padding:12px 20px">Search</button></div>
<div class="chips"><div class="chip active" data-type="upcoming">Upcoming</div><div class="chip" data-type="popular">Popular</div><div class="chip" data-type="top_rated">Top IMDb</div><div class="chip" data-genre="28">Action</div><div class="chip" data-genre="27">Horror</div><div class="chip" data-genre="35">Comedy</div></div></div>
<h2 id="sectionTitle">Upcoming Movies</h2><div class="movies" id="movies" style="margin-top:14px"></div>
</main>

<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<div class="modal-banner">
<div class="top-bar"><button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Back to Browse</button></div>
<img id="modalBackdrop" src=""><div class="play-btn" id="playBtn"><i class="fa-solid fa-play"></i></div>
<div class="trailer-wrap" id="trailerWrap"></div>
</div>
<div class="modal-content">
<h2 id="modalTitle" style="font-size:26px"></h2>
<div style="display:flex;gap:10px;margin:12px 0;align-items:center"><span class="rating" id="modalRating"></span><span id="modalYear" style="color:#939bb3;font-size:13px"></span><span id="modalRuntime" style="color:#939bb3;font-size:13px"></span></div>
<p id="modalDesc" style="color:#aab1c7;font-size:13px;line-height:1.7"></p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px"><button class="btn" id="modalTranslateBtn"><i class="fa-solid fa-closed-captioning"></i> Translate Subtitle</button><button style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15)" id="watchTrailerBtn"><i class="fa-solid fa-play"></i> Watch Trailer</button></div>
</div>
</div>
</div>

<script>
const API_KEY='3e931d5679569246e96918302b26fdfc';
const fileInput=document.getElementById('fileInput'),drop=document.getElementById('drop'),fname=document.getElementById('fname'),btn=document.getElementById('btn'),bar=document.getElementById('bar'),fill=document.getElementById('fill'),logEl=document.getElementById('log'),mainContent=document.getElementById('mainContent'),modalOverlay=document.getElementById('modalOverlay'),moviesEl=document.getElementById('movies'),searchInput=document.getElementById('searchInput'),trailerWrap=document.getElementById('trailerWrap'),playBtn=document.getElementById('playBtn'),modalBackdrop=document.getElementById('modalBackdrop');
let parsed=[],currentMovieId=null,currentTrailerKey=null;
function showLog(t){logEl.style.display='block';logEl.textContent=t;}
drop.onclick=()=>fileInput.click();fileInput.onchange=()=>{if(fileInput.files[0])loadFile(fileInput.files[0]);}
function loadFile(f){fname.textContent=f.name;const r=new FileReader();r.onload=e=>{parsed=parseSRT(e.target.result);showLog(parsed.length+' lines ready - FAST mode');btn.disabled=false;};r.readAsText(f);}
function parseSRT(d){d=d.replace(/\r/g,'').trim();const b=d.split(/\n\n+/);const o=[];for(let x of b){let l=x.split('\n');let t='',c='';if(l[0].includes('-->')){t=l[0];c=l.slice(1).join('\n');}else if(l[1]?.includes('-->')){t=l[1];c=l.slice(2).join('\n');}else continue;if(c)o.push({id:o.length+1,time:t,content:c});}return o;}
async function translateOne(text,from,to){try{const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`);const j=await r.json();return j[0][0][0]||text;}catch{return text;}}
btn.onclick=async()=>{const from=document.getElementById('from').value,to=document.getElementById('to').value;bar.style.display='block';btn.disabled=true;let res=new Array(parsed.length);let done=0;for(let i=0;i<parsed.length;i+=8){const batch=parsed.slice(i,i+8);await Promise.all(batch.map(async (it,idx)=>{const ri=i+idx;res[ri]={...it,content:await translateOne(it.content,from,to)};done++;fill.style.width=Math.round(done/parsed.length*100)+'%';showLog(`${done}/${parsed.length} - ${Math.round(done/parsed.length*100)}%`);}));}const final=res.map(r=>`${r.id}\n${r.time}\n${r.content}`).join('\n\n');const blob=new Blob([final],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${to}_translated.srt`;a.click();showLog('Done! Check Downloads');bar.style.display='none';btn.disabled=false;}

async function fetchMovies(url,title){
 document.getElementById('sectionTitle').textContent=title; moviesEl.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#939bb3">Loading...</div>';
 const r=await fetch(url); const d=await r.json();
 const list=(d.results||[]).slice(0,20).map(m=>({id:m.id,title:m.title,year:m.release_date?.slice(0,4)||'',rating:m.vote_average?.toFixed(1)||'0',poster:m.poster_path?`https://image.tmdb.org/t/p/w500${m.poster_path}`:'',backdrop:m.backdrop_path?`https://image.tmdb.org/t/p/w1280${m.backdrop_path}`:`https://image.tmdb.org/t/p/w500${m.poster_path}`,desc:m.overview||''}));
 render(list);
}
function render(list){
 moviesEl.innerHTML=''; list.forEach(m=>{
  const div=document.createElement('div'); div.className='movie';
  div.innerHTML=`<img class="poster" src="${m.poster}"><div class="movie-info"><h3 style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.title}</h3><div style="margin-top:6px;display:flex;gap:8px"><span class="rating">★ ${m.rating}</span><span style="font-size:10px;color:#939bb3">${m.year}</span></div></div>`;
  div.onclick=()=>openModal(m); moviesEl.appendChild(div);
 });
}
async function openModal(m){
 currentMovieId=m.id; currentTrailerKey=null; trailerWrap.innerHTML=''; trailerWrap.classList.remove('active'); playBtn.style.display='grid'; modalBackdrop.style.display='block';
 document.getElementById('modalTitle').textContent=m.title; document.getElementById('modalRating').textContent='★ '+m.rating; document.getElementById('modalYear').textContent=m.year; document.getElementById('modalDesc').textContent=m.desc; modalBackdrop.src=m.backdrop;
 modalOverlay.classList.add('active'); mainContent.classList.add('blurred'); document.body.classList.add('modal-open');
 try{const r=await fetch(`https://api.themoviedb.org/3/movie/${m.id}/videos?api_key=${API_KEY}&language=en-US`);const d=await r.json();const trailer=d.results?.find(v=>v.type==='Trailer'&&v.site==='YouTube')||d.results?.[0];if(trailer)currentTrailerKey=trailer.key;}catch{}
}
function playTrailer(){if(!currentTrailerKey){showLog('Trailer not available for this movie');return;} trailerWrap.innerHTML=`<iframe src="https://www.youtube.com/embed/${currentTrailerKey}?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`; trailerWrap.classList.add('active'); modalBackdrop.style.display='none'; playBtn.style.display='none';}
function closeModal(){modalOverlay.classList.remove('active'); mainContent.classList.remove('blurred'); document.body.classList.remove('modal-open'); trailerWrap.innerHTML=''; trailerWrap.classList.remove('active');}
document.getElementById('backBtn').onclick=closeModal;
document.getElementById('modalTranslateBtn').onclick=()=>{closeModal(); window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('watchTrailerBtn').onclick=playTrailer; playBtn.onclick=playTrailer;
modalOverlay.onclick=e=>{if(e.target===modalOverlay)closeModal();}
document.querySelectorAll('.chip').forEach(c=>{c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');const t=c.dataset.type,g=c.dataset.genre;if(t==='upcoming')fetchMovies(`https://api.themoviedb.org/3/movie/upcoming?api_key=${API_KEY}&language=en-US&page=1`,'Upcoming');else if(t==='popular')fetchMovies(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=en-US&page=1`,'Popular');else if(t==='top_rated')fetchMovies(`https://api.themoviedb.org/3/movie/top_rated?api_key=${API_KEY}&language=en-US&page=1`,'Top IMDb');else if(g)fetchMovies(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${g}&sort_by=popularity.desc`,'Genre: '+c.textContent);}});
document.getElementById('searchBtn').onclick=()=>{const q=searchInput.value.trim();if(q)fetchMovies(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(q)}`,'Search: '+q);};
searchInput.onkeydown=e=>{if(e.key==='Enter')document.getElementById('searchBtn').click();};
fetchMovies(`https://api.themoviedb.org/3/movie/upcoming?api_key=${API_KEY}&language=en-US&page=1`,'Upcoming Movies');
</script>
</body>
</html>
